[project]
name = "m3-dnp-lab"
version = "0.1.0"
description = "Ezermalas e-pakalpojums \"Iesniegumi\" · atjaunošanas mācības (mācību prototips)"
requires-python = ">=3.10"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # garus paziņojumu tekstus nelauž; kodu formatē ruff format

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient."]
